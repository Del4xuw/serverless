version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
      
  pre_build:
    commands:
      - echo "Running linter..."
      - npm run lint || echo "Lint warnings - continuing build"
      - echo "Type checking..."
      - npm run typecheck || echo "Type check warnings - continuing build"
      
  build:
    commands:
      - echo "Building TypeScript..."
      - npm run build
      - echo "Running tests..."
      - npm test
      
  post_build:
    commands:
      - |
        if [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
          echo "✅ Tests passed! Build successful!"
          echo "Packaging for Lambda..."
          echo "In production, this would deploy to AWS Lambda"
          # Descomenta cuando estés listo para deployar:
          # npx serverless deploy --stage $STAGE --region $AWS_DEFAULT_REGION --verbose
        else
          echo "❌ Tests failed! Skipping deployment."
          exit 1
        fi

cache:
  paths:
    - 'node_modules/**/*'