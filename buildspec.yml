version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
      
pre_build:
  commands:
    - echo "Running linter..."
    - npm run lint || echo "⚠️ Lint warnings ignored for demo"  # <- Cambia esta línea
    - echo "Type checking..."
    - npm run typecheck
  build:
    commands:
      - echo "Building TypeScript..."
      - npm run build
      - echo "Running tests..."
      - npm test
      
  post_build:
    commands:
      - echo "Packaging for Lambda..."
      - npm prune --production
      - |
        if [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
          echo "Tests passed! Deploying to AWS Lambda..."
          npx serverless deploy --stage $STAGE --region $AWS_REGION
        else
          echo "Tests failed! Skipping deployment."
          exit 1
        fi

artifacts:
  files:
    - '**/*'
  base-directory: .serverless

cache:
  paths:
    - 'node_modules/**/*'

env:
  variables:
    STAGE: dev
    AWS_REGION: us-east-1