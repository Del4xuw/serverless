service: serverless-typescript-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  environment:
    NODE_ENV: ${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'info'}
    SERVICE_NAME: ${self:service}
  # IAM role statements (uncomment when deploying to AWS)
  # iam:
  #   role:
  #     statements:
  #       - Effect: Allow
  #         Action:
  #           - logs:CreateLogGroup
  #           - logs:CreateLogStream
  #           - logs:PutLogEvents
  #         Resource: '*'

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  # Stage-specific log levels
  logLevel:
    dev: debug
    prod: info

  # esbuild configuration for TypeScript bundling
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - aws-sdk
    target: node20
    platform: node
    concurrency: 10
    watch:
      pattern:
        - 'src/**/*.ts'
      ignore:
        - '.build/**'
        - '.serverless/**'
        - 'node_modules/**'

  # serverless-offline configuration
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0
    corsAllowOrigin: '*'
    corsAllowHeaders: 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'
    corsAllowCredentials: true
    noPrependStageInUrl: true
    reloadHandler: true

functions:
  # Health check endpoint
  health:
    handler: src/handlers/health.handler
    description: Health check endpoint
    events:
      - http:
          path: /health
          method: get
          cors: true

  # Get all users
  getUsers:
    handler: src/handlers/getUsers.handler
    description: Get all users
    events:
      - http:
          path: /api/users
          method: get
          cors: true

  # Get single user by ID
  getUser:
    handler: src/handlers/getUser.handler
    description: Get user by ID
    events:
      - http:
          path: /api/users/{id}
          method: get
          cors: true
          request:
            parameters:
              paths:
                id: true

  # Create new user
  createUser:
    handler: src/handlers/createUser.handler
    description: Create a new user
    events:
      - http:
          path: /api/users
          method: post
          cors: true

  # Delete user
  deleteUser:
    handler: src/handlers/deleteUser.handler
    description: Delete user by ID
    events:
      - http:
          path: /api/users/{id}
          method: delete
          cors: true
          request:
            parameters:
              paths:
                id: true

# Package configuration
package:
  individually: true
  patterns:
    - '!.git/**'
    - '!.gitignore'
    - '!.DS_Store'
    - '!npm-debug.log'
    - '!.serverless/**'
    - '!coverage/**'
    - '!tests/**'
    - '!docker/**'
    - '!*.md'
    - '!Makefile'
